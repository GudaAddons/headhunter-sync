[package]
name = "headhunter-sync"
version = "0.1.1"
description = "Uploads HeadHunter addon data to the HeadHunter website and brings its lists back into the game"
authors = ["Vati"]
license = "MIT"
repository = "https://github.com/GudaAddons/headhunter-sync"
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "headhunter_sync_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri-plugin-autostart = "2.5.1"
tauri-plugin-single-instance = "2.4.5"
tauri-plugin-dialog = "2.7.3"
tauri-plugin-notification = "2.4.0"
notify = "8.2.0"
thiserror = "2.0.21"
tokio = { version = "1.53.1", features = ["time", "sync", "macros", "net", "io-util"] }
keyring = { version = "3", features = ["windows-native", "apple-native", "sync-secret-service"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
sha2 = "0.11.0"
base64 = "0.23.1"
rand = "0.10.3"
tauri-plugin-updater = "2.12.0"


# Read the optimization guideline for more details: https://tauri.app/concept/size/#cargo-configuration
[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true

[target."cfg(windows)".dependencies]
winreg = "0.56.0"
