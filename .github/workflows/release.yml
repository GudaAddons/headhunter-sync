# A version tag (npm version 0.2.0 && git push --follow-tags) builds the production
# app on Windows, signs the update and publishes a GitHub release with latest.json,
# which installed apps check for updates.
#
# Repository settings:
#   Variables: HEADHUNTER_API_URL   the website's https:// address
#   Secrets:   TAURI_SIGNING_PRIVATE_KEY           contents of headhunter-sync.key
#              TAURI_SIGNING_PRIVATE_KEY_PASSWORD  contents of headhunter-sync.key.password
name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5

      - name: Check the tag matches the app version
        shell: bash
        run: |
          version=$(node -p "require('./package.json').version")
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "Tag $GITHUB_REF_NAME does not match package.json version $version"
            exit 1
          fi

      - name: Check the website address is set
        shell: bash
        env:
          HEADHUNTER_API_URL: ${{ vars.HEADHUNTER_API_URL }}
        run: |
          case "$HEADHUNTER_API_URL" in
            https://*) ;;
            *) echo "Set the HEADHUNTER_API_URL repository variable to the website's https:// address"; exit 1 ;;
          esac

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@stable

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'

      - run: npm ci

      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          HEADHUNTER_BUILD: prod
          HEADHUNTER_API_URL: ${{ vars.HEADHUNTER_API_URL }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: HeadHunter Sync ${{ github.ref_name }}
          releaseBody: Download the setup file below. Installed apps offer this update on their own.
          releaseDraft: false
          includeUpdaterJson: true
