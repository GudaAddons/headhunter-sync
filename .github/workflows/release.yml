# A version tag (npm version 0.2.0 && git push --follow-tags) builds the production
# app for Windows and macOS, signs the updates and publishes a GitHub release with
# latest.json, which installed apps check for updates.
#
# Release files carry the system in their names:
#   HeadHunter-Sync_<version>_Windows-setup.exe
#   HeadHunter-Sync_<version>_macOS.dmg (universal: Apple Silicon and Intel)
# The update signatures live inside latest.json, so the .sig files are not uploaded.
#
# "Run workflow" (workflow_dispatch) is a dry run: the same build and signing, but only a
# draft release tagged dry-run-v<version>. Installed apps never see drafts. Without the
# HEADHUNTER_API_URL variable it builds against https://dry-run.invalid. Delete the draft after.
#
# Repository settings:
#   Variables: HEADHUNTER_API_URL   the website's https:// address
#   Secrets:   TAURI_SIGNING_PRIVATE_KEY           contents of headhunter-sync.key
#              TAURI_SIGNING_PRIVATE_KEY_PASSWORD  contents of headhunter-sync.key.password
#              CERTUM_USER       SimplySign login (email)
#              CERTUM_OTP_URI    otpauth:// link from the SimplySign QR code
#              CERTUM_CERT_SHA1  thumbprint of the Certum code signing certificate
#
# With the CERTUM_ secrets set, the Windows job logs in to SimplySign Desktop
# (scripts/simplysign-login.ps1) and Tauri signs the app and the installer with the Certum
# certificate before it makes the update signature. If the login or the check fails, nothing
# is released. Without CERTUM_CERT_SHA1 the installer is not code-signed.
name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: windows-latest
            system: Windows
            args: --bundles nsis
            rust_targets: ''
          - runner: macos-latest
            system: macOS
            args: --target universal-apple-darwin --bundles app,dmg
            rust_targets: aarch64-apple-darwin,x86_64-apple-darwin
    runs-on: ${{ matrix.runner }}
    env:
      DRY_RUN: ${{ github.event_name == 'workflow_dispatch' }}
      API_URL: ${{ vars.HEADHUNTER_API_URL || (github.event_name == 'workflow_dispatch' && 'https://dry-run.invalid' || '') }}
      CODE_SIGN: ${{ matrix.system == 'Windows' && secrets.CERTUM_CERT_SHA1 != '' }}
      SIMPLYSIGN_MSI: https://files.certum.eu/software/SimplySignDesktop/Windows/9.4.5.95/SimplySignDesktop-9.4.5.95-64-bit-en.msi
    steps:
      - uses: actions/checkout@v5

      - name: Check the tag matches the app version
        if: env.DRY_RUN != 'true'
        shell: bash
        run: |
          version=$(node -p "require('./package.json').version")
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "Tag $GITHUB_REF_NAME does not match package.json version $version"
            exit 1
          fi

      - name: Check the website address is set
        shell: bash
        env:
          HEADHUNTER_API_URL: ${{ env.API_URL }}
        run: |
          case "$HEADHUNTER_API_URL" in
            https://*) ;;
            *) echo "Set the HEADHUNTER_API_URL repository variable to the website's https:// address"; exit 1 ;;
          esac

      - name: Release tag
        id: tag
        shell: bash
        run: |
          if [ "$DRY_RUN" = "true" ]; then
            echo "name=dry-run-v$(node -p "require('./package.json').version")" >> "$GITHUB_OUTPUT"
          else
            echo "name=$GITHUB_REF_NAME" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust_targets }}

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'

      - run: npm ci

      - name: Cache SimplySign Desktop
        if: env.CODE_SIGN == 'true'
        uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/simplysign
          key: simplysign-9.4.5.95

      - name: Install SimplySign Desktop
        if: env.CODE_SIGN == 'true'
        shell: pwsh
        run: |
          $dir = "$env:RUNNER_TEMP\simplysign"
          $msi = "$dir\SimplySignDesktop.msi"
          if (-not (Test-Path $msi)) {
            New-Item -ItemType Directory -Force $dir | Out-Null
            Invoke-WebRequest $env:SIMPLYSIGN_MSI -OutFile $msi
          }
          $install = Start-Process msiexec.exe -ArgumentList '/i', "`"$msi`"", '/qn', '/norestart' -Wait -PassThru
          if ($install.ExitCode -notin 0, 3010) { throw "SimplySign Desktop install failed: $($install.ExitCode)" }

      - name: Log in to SimplySign
        if: env.CODE_SIGN == 'true'
        shell: pwsh
        env:
          CERTUM_USER: ${{ secrets.CERTUM_USER }}
          CERTUM_OTP_URI: ${{ secrets.CERTUM_OTP_URI }}
          CERTUM_CERT_SHA1: ${{ secrets.CERTUM_CERT_SHA1 }}
        run: ./scripts/simplysign-login.ps1

      - name: Code signing settings
        id: codesign
        shell: pwsh
        env:
          CERTUM_CERT_SHA1: ${{ secrets.CERTUM_CERT_SHA1 }}
        run: |
          if ($env:CODE_SIGN -ne 'true') { "args=" >> $env:GITHUB_OUTPUT; exit 0 }
          $file = "$env:RUNNER_TEMP\codesign.conf.json"
          @{ bundle = @{ windows = @{
            certificateThumbprint = $env:CERTUM_CERT_SHA1.Replace(' ', '').ToUpper()
            digestAlgorithm = 'sha256'
            timestampUrl = 'http://time.certum.pl'
            tsp = $true
          } } } | ConvertTo-Json -Depth 5 | Set-Content $file -Encoding utf8NoBOM
          "args=--config $($file.Replace('\', '/'))" >> $env:GITHUB_OUTPUT

      - uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          HEADHUNTER_BUILD: prod
          HEADHUNTER_API_URL: ${{ env.API_URL }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          args: ${{ matrix.args }} ${{ steps.codesign.outputs.args }}
          tagName: ${{ steps.tag.outputs.name }}
          releaseName: HeadHunter Sync ${{ steps.tag.outputs.name }}
          releaseBody: |
            Download the file for your system:
            - **Windows:** `HeadHunter-Sync_..._Windows-setup.exe`
            - **macOS:** `HeadHunter-Sync_..._macOS.dmg` (Apple Silicon and Intel). The first time, right-click the app and choose Open, as it is not signed by Apple yet.

            Installed apps offer this update on their own.
          releaseDraft: ${{ env.DRY_RUN == 'true' }}
          releaseAssetNamePattern: HeadHunter-Sync_[version]_${{ matrix.system }}[setup][ext]
          uploadUpdaterJson: true
          uploadUpdaterSignatures: false

      - name: Check the code signature
        if: env.CODE_SIGN == 'true'
        shell: pwsh
        run: |
          $files = Get-ChildItem src-tauri/target/release/bundle/nsis/*.exe
          if (-not $files) { throw 'No installer found' }
          foreach ($file in $files) {
            $signature = Get-AuthenticodeSignature $file.FullName
            if ($signature.Status -ne 'Valid' -or -not $signature.TimeStamperCertificate) {
              throw "$($file.Name) is not signed with a timestamp: $($signature.Status)"
            }
            Write-Host "$($file.Name): $($signature.SignerCertificate.Subject)"
          }
